name: Conformidad de atlas

# Corre el chequeo de conformidad (N1-N5 + autocontención) en cada push y en
# cada pull request. Si algún atlas no cumple la parte normativa del estándar,
# el job falla y el PR queda marcado en rojo.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  conformidad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Verificar conformidad N1-N5 + autocontención
        run: bash verificar-conformidad.sh
